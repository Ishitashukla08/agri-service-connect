name: Deploy Agri Service Connect

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          parts = urllib.parse.urlsplit(url)
          query = urllib.parse.parse_qsl(parts.query)
          query.append(("audience", "sts.amazonaws.com"))
          url = urllib.parse.urlunsplit(
              (
                  parts.scheme,
                  parts.netloc,
                  parts.path,
                  urllib.parse.urlencode(query),
                  parts.fragment,
              )
          )

          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {request_token}"},
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("Issuer:", claims.get("iss"))
          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::652086272176:role/GitHubActions-AgriServiceConnect
          aws-region: ap-southeast-2

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../deploy.zip . \
            -x "node_modules/*" ".env"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deploy.zip \
            "s3://elasticbeanstalk-ap-southeast-2-652086272176/deploy-${{ github.sha }}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "Agri Service Connect" \
            --version-label "github-${{ github.sha }}" \
            --source-bundle \
              S3Bucket="elasticbeanstalk-ap-southeast-2-652086272176",S3Key="deploy-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "AgriServiceConnect-env" \
            --version-label "github-${{ github.sha }}"