name: Deploy Agri Service Connect

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Inspect GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null)

          echo "Issuer:"
          echo "$PAYLOAD" | jq -r '.iss'

          echo "Audience:"
          echo "$PAYLOAD" | jq -r '.aud'

          echo "Subject:"
          echo "$PAYLOAD" | jq -r '.sub'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::652086272176:role/GitHubActions-AgriServiceConnect
          aws-region: ap-southeast-2

      - name: Create deployment package
        run: |
          cd backend
          zip -r ../deploy.zip . \
            -x "node_modules/*" ".env"

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deploy.zip s3://elasticbeanstalk-ap-southeast-2-652086272176/deploy-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "Agri Service Connect" \
            --version-label "github-${{ github.sha }}" \
            --source-bundle S3Bucket="elasticbeanstalk-ap-southeast-2-652086272176",S3Key="deploy-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "AgriServiceConnect-env" \
            --version-label "github-${{ github.sha }}"